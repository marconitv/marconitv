        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* Contenedor 16:9 estricto universal */
        .player-aspect-ratio {
            position: relative;
            width: 100%;
            max-width: 960px;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #22222c;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            outline: none;
        }

        .player-viewport {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        /* Indicadores de Estado en Pantalla */
        .status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: rgba(10, 10, 14, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .status-message.hidden {
            opacity: 0;
            display: none;
        }

        .status-message.error {
            border-color: #ff2a4b;
            color: #ff2a4b;
            background: rgba(255, 42, 75, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* HUD auto-ocultable */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .hud-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .hud-overlay * {
            pointer-events: auto;
        }

        /* Título superior y Reloj */
        .player-top-header {
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .channel-title-badge {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #22222c;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-title-badge img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 3px;
        }

        .channel-title-badge span {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }

        /* Reloj de Argentina en vivo */
        .clock-badge {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #22222c;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #d1d1d6;
            letter-spacing: 0.5px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 800;
            color: #ff2a4b;
            background: rgba(255, 42, 75, 0.15);
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 42, 75, 0.4);
            margin-left: 4px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #ff2a4b;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff2a4b;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Panel Inferior */
        .player-bottom-panel {
            display: flex;
            flex-direction: column;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            padding: 8px 16px 12px 16px;
            gap: 6px;
        }

        .seekbar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .seekbar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            accent-color: #ff2a4b;
        }

        .time-display {
            font-size: 11px;
            font-weight: 600;
            color: #d1d1d6;
            min-width: 75px;
            text-align: right;
        }

        .player-hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            cursor: pointer;
            outline: none;
            transition: background 0.2s, transform 0.2s;
        }

        .icon-btn svg {
            width: 18px !important;
            height: 18px !important;
            min-width: 18px !important;
            min-height: 18px !important;
            display: block !important;
        }

        .icon-btn:hover, .icon-btn:focus {
            background: #ff2a4b !important;
            box-shadow: 0 0 0 2px #ffffff !important;
            transform: scale(1.1);
        }

        .icon-btn.primary {
            background: #ff2a4b;
            width: 40px;
            height: 40px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 20px;
        }

        .volume-slider {
            width: 60px;
            cursor: pointer;
            accent-color: #ff2a4b;
        }

        .cast-modal {
            position: absolute;
            bottom: 60px;
            right: 40px;
            width: 240px;
            background: #181822;
            border: 1px solid #333342;
            border-radius: 8px;
            padding: 12px;
            z-index: 30;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none;
        }

        .cast-modal.open {
            display: block;
        }

        .cast-modal h5 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #aaa;
            text-transform: uppercase;
        }

        .cast-device-item {
            padding: 8px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .cast-device-item:hover {
            background: #ff2a4b;
            color: #fff;
        }

        .channel-drawer {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 280px;
            background: #121218;
            border-left: 1px solid #22222c;
            z-index: 20;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            -webkit-transform: translateX(100%);
            transition: transform 0.25s ease-in-out;
            -webkit-transition: -webkit-transform 0.25s ease-in-out;
        }

        .channel-drawer.open {
            transform: translateX(0);
            -webkit-transform: translateX(0);
        }

        .drawer-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #22222c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #181820;
            color: #fff;
            text-transform: uppercase;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .channel-item:hover, .channel-item.active, .channel-item:focus {
            background: rgba(255, 42, 75, 0.25) !important;
            border-color: #ff2a4b !important;
            box-shadow: 0 0 0 2px #ffffff !important;
        }

        .channel-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 4px;
            background: #000;
        }

        .channel-info h4 {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }

        .channel-info p {
            font-size: 10px;
            color: #9494a3;
            margin-top: 1px;
        }

        .quality-select {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }
        .quality-select option {
            background: #121218;
            color: #fff;

    <div class="player-aspect-ratio" id="main-player" tabindex="0">
        <div class="player-viewport">
            
            <!-- MENSAJES DE ESTADO -->
            <div id="status-loading" class="status-message">
                <span class="spinner"><i data-lucide="loader" style="width:18px;height:18px;"></i></span>
                <span>Cargando señal...</span>
            </div>

            <div id="status-error" class="status-message error hidden">

                <span>Error canal no disponible</span>
            </div>

            <!-- VÍDEO -->
            <div class="video-wrapper">
                <video id="html5-video" style="display:none;" playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>

                    <div id="yt-target" style="width:100%; height:100%;"></div>
                </div>
            </div>

            <!-- MODAL DISPOSITIVOS CAST -->
            <div class="cast-modal" id="cast-modal">
                <h5>Dispositivos Chromecast</h5>
                <div class="cast-device-item" id="cast-simulated-device">Televisión de la Sala (Cast)</div>
                <div class="cast-device-item" style="color: #888; cursor: default;">Buscando más dispositivos...</div>
            </div>

            <!-- HUD SUPERIOR E INFERIOR (Auto-ocultable) -->
            <div class="hud-overlay" id="hud-overlay">
                <!-- TÍTULO SUPERIOR, EN VIVO Y HORA ARGENTINA -->
                <div class="player-top-header">
                    <div class="channel-title-badge">
                        <img id="top-channel-logo" src="" alt="" style="display:none;" />
                        <span id="top-channel-name">Cargando...</span>
                        <div class="live-indicator">
                            <span class="live-dot"></span> EN VIVO
                        </div>
                    </div>
                    <div class="clock-badge" id="argentina-clock">00:00:00</div>
                </div>

                <!-- PANEL INFERIOR (SEEKBAR + CONTROLES) -->
                <div class="player-bottom-panel">
                    <div class="seekbar-container">
                        <input type="range" class="seekbar" id="video-seekbar" value="0" min="0" max="100" step="0.1" tabindex="0" title="Línea de Reproducción" />
                        <div class="time-display" id="time-display">00:00 / 00:00</div>
                    </div>

                    <div class="player-hud">
                        <div class="control-group">
                            <button class="icon-btn" id="btn-prev" tabindex="0" title="Canal Anterior"><i data-lucide="skip-back"></i></button>
                            <button class="icon-btn" id="btn-rewind" tabindex="0" title="Retroceder 10s"><i data-lucide="rotate-ccw"></i></button>
                            <button class="icon-btn primary" id="btn-play" tabindex="0" title="Play / Pausa"><i data-lucide="pause" id="icon-play"></i></button>
                            <button class="icon-btn" id="btn-forward" tabindex="0" title="Avanzar 10s"><i data-lucide="rotate-cw"></i></button>
                            <button class="icon-btn" id="btn-next" tabindex="0" title="Canal Siguiente"><i data-lucide="skip-forward"></i></button>
                        </div>

                        <div class="control-group">
                            <!-- VOLUMEN Y MUTE -->
                            <div class="volume-container">
                                <button class="icon-btn" id="btn-mute" tabindex="0" title="Silenciar" style="width:28px;height:28px;background:transparent;"><i data-lucide="volume-2" id="icon-volume"></i></button>
                                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100" tabindex="0" title="Volumen" />
                            </div>

                            <!-- SELECTOR DE CALIDAD -->
                            <select class="quality-select tv-focusable" id="quality-select" tabindex="0" title="Calidad">
                                <option value="auto">Calidad: Auto</option>
                            </select>

                            <!-- BOTÓN CAST -->
                            <div class="cast-wrapper" title="Transmitir a la Tele">
                                <button class="icon-btn" id="btn-cast" tabindex="0">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                                </button>
                            </div>

                            <!-- CANALES -->
                            <button class="icon-btn" id="btn-drawer" tabindex="0" title="Canales"><i data-lucide="list"></i></button>
                            <button class="icon-btn" id="btn-fullscreen" tabindex="0" title="Pantalla Completa"><i data-lucide="maximize"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DESPLEGABLE LATERAL DE CANALES -->
            <div class="channel-drawer" id="channel-drawer">
                <div class="drawer-header">
                    <span>CANALES</span>
                    <button class="icon-btn" id="btn-close-drawer" tabindex="0" style="width:28px; height:28px;"><i data-lucide="x"></i></button>
                </div>
                <div class="channel-list" id="channel-container"></div>
            </div>

        </div>
    </div>

            var currentIndex = 0;
            var videoEl = document.getElementById("html5-video");
            var ytWrapper = document.getElementById("yt-wrapper");
            var drawer = document.getElementById("channel-drawer");

            var mainPlayer = document.getElementById("main-player");
            var volumeSlider = document.getElementById("volume-slider");
            var qualitySelect = document.getElementById("quality-select");
            var seekbar = document.getElementById("video-seekbar");
            var timeDisplay = document.getElementById("time-display");
            var statusLoading = document.getElementById("status-loading");
            var statusError = document.getElementById("status-error");
            var castModal = document.getElementById("cast-modal");
            var clockDisplay = document.getElementById("argentina-clock");
            
            var hlsPlayer = null;
            var castSession = null;
            var hudTimeout = null;
            var isSeeking = false;

            function refreshIcons() {
                if (window.lucide && typeof window.lucide.createIcons === "function") {
                    window.lucide.createIcons();
                }
            }

            // Reloj en tiempo real de Argentina (America/Argentina/Buenos_Aires)
            function updateArgentinaClock() {
                try {
                    var options = { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                    var timeString = new Intl.DateTimeFormat('es-AR', options).format(new Date());
                    clockDisplay.textContent = timeString + " ARG";
                } catch(e) {
                    var d = new Date();
                    clockDisplay.textContent = d.toLocaleTimeString() + " ARG";
                }
            }
            setInterval(updateArgentinaClock, 1000);
            updateArgentinaClock();

            function showLoading(show) {
                if (show) {
                    statusLoading.className = "status-message";
                    statusError.className = "status-message error hidden";
                } else {
                    statusLoading.className = "status-message hidden";
                }
            }

            function showError(show) {
                if (show) {
                    statusError.className = "status-message error";
                    statusLoading.className = "status-message hidden";
                } else {
                    statusError.className = "status-message error hidden";
                }
            }

            function formatTime(seconds) {
                var m = Math.floor(seconds / 60);
                var s = Math.floor(seconds % 60);
                return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
            }

            videoEl.addEventListener("timeupdate", function() {
                if (!isSeeking && videoEl.duration) {
                    var percent = (videoEl.currentTime / videoEl.duration) * 100;
                    seekbar.value = percent;
                }
                var current = formatTime(videoEl.currentTime || 0);
                var duration = videoEl.duration ? formatTime(videoEl.duration) : "En Vivo";
                timeDisplay.textContent = current + " / " + duration;
            });

            seekbar.addEventListener("input", function() {
                isSeeking = true;
            });

            seekbar.addEventListener("change", function() {
                if (videoEl.duration) {
                    var newTime = (seekbar.value / 100) * videoEl.duration;
                    videoEl.currentTime = newTime;
                }
                isSeeking = false;
            });

            function showHUD() {
                hudOverlay.className = "hud-overlay";
                clearTimeout(hudTimeout);
                if (drawer.className.indexOf("open") === -1 && !castModal.classList.contains("open")) {
                    hudTimeout = setTimeout(function() {
                        hudOverlay.className = "hud-overlay hidden";
                    }, 4000);
                }
            }

            mainPlayer.addEventListener("mousemove", showHUD);
            mainPlayer.addEventListener("click", showHUD);

            function loadChannel(index) {
                if (!channels[index]) return;
                currentIndex = index;
                var ch = channels[index];

                document.getElementById("top-channel-name").textContent = ch.name;
                var topLogo = document.getElementById("top-channel-logo");
                if (ch.logo) {
                    topLogo.src = ch.logo;
                    topLogo.style.display = "block";
                } else {
                    topLogo.style.display = "none";
                }

                showLoading(true);
                showError(false);
                showHUD();

                if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
                videoEl.pause();
                videoEl.removeAttribute("src");
                videoEl.load();
                videoEl.style.display = "none";
                ytWrapper.style.display = "none";
                qualitySelect.innerHTML = '<option value="auto">Calidad: Auto</option>';

                if (castSession) {
                    castMedia(ch);
                    renderList();
                    return;
                }

                var ytMatch = ch.url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|live\/))([\w-]{11})/);

                if (ytMatch) {
                    ytWrapper.style.display = "block";
                    document.getElementById("yt-target").innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + ytMatch[1] + '?autoplay=1&controls=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
                    setTimeout(function() { showLoading(false); }, 1500);
                } else if (ch.url.indexOf(".m3u8") !== -1) {
                    videoEl.style.display = "block";
                    if (window.Hls && Hls.isSupported()) {
                        hlsPlayer = new Hls({ enableWorker: false });
                        hlsPlayer.loadSource(ch.url);
                        hlsPlayer.attachMedia(videoEl);
                        
                        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () { 
                            videoEl.volume = volumeSlider.value / 100;
                            videoEl.play().catch(function(){}); 
                            showLoading(false);
                            populateQualityLevels();
                        });

                        hlsPlayer.on(Hls.Events.ERROR, function (event, data) {
                            if (data.fatal) {
                                showLoading(false);
                                showError(true);
                            }
                        });
                    } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
                        videoEl.src = ch.url;
                        videoEl.volume = volumeSlider.value / 100;
                        videoEl.play().then(function() {
                            showLoading(false);
                        }).catch(function(){
                            showLoading(false);
                            showError(true);
                        });
                    }
                } else {
                    videoEl.style.display = "block";
                    videoEl.src = ch.url;
                    videoEl.volume = volumeSlider.value / 100;
                    videoEl.play().then(function() {
                        showLoading(false);
                    }).catch(function(){
                        showLoading(false);
                        showError(true);
                    });
                }

                renderList();
            }

            videoEl.addEventListener("error", function() {
                showLoading(false);
                showError(true);
            });

            function populateQualityLevels() {
                if (!hlsPlayer || !hlsPlayer.levels) return;
                qualitySelect.innerHTML = '<option value="-1">Calidad: Auto</option>';
                for (var i = 0; i < hlsPlayer.levels.length; i++) {
                    var lvl = hlsPlayer.levels[i];
                    var height = lvl.height ? lvl.height + "p" : "Nivel " + i;
                    var opt = document.createElement("option");
                    opt.value = i;
                    opt.textContent = height;
                    qualitySelect.appendChild(opt);
                }
            }

            qualitySelect.addEventListener("change", function() {
                if (hlsPlayer) {
                    hlsPlayer.currentLevel = parseInt(this.value, 10);
                }
            });

            volumeSlider.addEventListener("input", function() {
                videoEl.volume = this.value / 100;
                videoEl.muted = (this.value == 0);
                updateVolumeIcon();
            });

            document.getElementById("btn-mute").addEventListener("click", function() {
                videoEl.muted = !videoEl.muted;
                if (videoEl.muted) {
                    volumeSlider.value = 0;
                } else {
                    volumeSlider.value = videoEl.volume * 100 || 100;
                }
                updateVolumeIcon();
            });

            function updateVolumeIcon() {
                var iconVol = document.getElementById("icon-volume");
                if (videoEl.muted || volumeSlider.value == 0) {
                    iconVol.setAttribute("data-lucide", "volume-x");
                } else if (volumeSlider.value < 50) {
                    iconVol.setAttribute("data-lucide", "volume-1");
                } else {
                    iconVol.setAttribute("data-lucide", "volume-2");
                }
                refreshIcons();
            }

            document.getElementById("btn-play").addEventListener("click", function () {
                if (videoEl.style.display !== "none") {
                    var iconPlay = document.getElementById("icon-play");
                    if (videoEl.paused) {
                        videoEl.play();
                        iconPlay.setAttribute("data-lucide", "pause");
                    } else {
                        videoEl.pause();
                        iconPlay.setAttribute("data-lucide", "play");
                    }
                    refreshIcons();
                }
            });

            document.getElementById("btn-rewind").addEventListener("click", function() {
                if (videoEl.style.display !== "none" && videoEl.currentTime) {
                    videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
                }
            });

            document.getElementById("btn-forward").addEventListener("click", function() {
                if (videoEl.style.display !== "none" && videoEl.currentTime) {
                    videoEl.currentTime = Math.min(videoEl.duration || 0, videoEl.currentTime + 10);
                }
            });

            document.getElementById("btn-next").addEventListener("click", function () {
                loadChannel((currentIndex + 1) % channels.length);
            });

            document.getElementById("btn-prev").addEventListener("click", function () {
                loadChannel((currentIndex - 1 + channels.length) % channels.length);
            });

            document.getElementById("btn-fullscreen").addEventListener("click", function () {
                var player = document.getElementById("main-player");
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (player.requestFullscreen) player.requestFullscreen();
                    else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            });

            function renderList() {
                var container = document.getElementById("channel-container");
                container.innerHTML = "";

                for (var i = 0; i < channels.length; i++) {
                    (function(idx) {
                        var ch = channels[idx];
                        var item = document.createElement("div");
                        item.className = "channel-item" + (idx === currentIndex ? " active" : "");
                        item.setAttribute("tabindex", "0");

                        item.innerHTML = 
                            '<img class="channel-logo" src="' + ch.logo + '" alt="Logo" />' +
                            '<div class="channel-info">' +
                                '<h4>' + ch.name + '</h4>' +
                                '<p>' + ch.desc + '</p>' +
                            '</div>';

                        item.addEventListener("click", function () {
                            loadChannel(idx);
                            drawer.className = "channel-drawer";
                        });

                        item.addEventListener("focus", function() {
                            if (item.scrollIntoView) {
                                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        });

                        container.appendChild(item);
                    })(i);
                }
            }

            document.getElementById("btn-drawer").addEventListener("click", function () {
                if (drawer.className.indexOf("open") !== -1) {
                    drawer.className = "channel-drawer";
                    showHUD();
                } else {
                    drawer.className = "channel-drawer open";
                    castModal.classList.remove("open");
                    clearTimeout(hudTimeout);
                    hudOverlay.className = "hud-overlay";
                    renderList();
                    var activeItem = drawer.querySelector(".channel-item.active");
                    if (activeItem) activeItem.focus();
                }
            });

            document.getElementById("btn-close-drawer").addEventListener("click", function () {
                drawer.className = "channel-drawer";
                showHUD();
            });

            /* GESTIÓN DE GOOGLE CAST Y MENÚ DE RED */
            document.getElementById("btn-cast").addEventListener("click", function() {
                if (window.location.protocol === "file:") {
                    alert("Aviso: Estás abriendo el archivo como 'file:///'. Google Cast requiere un servidor web local (como Live Server en VSCode o localhost) para detectar dispositivos en tu red.");
                }

                if (window.cast && window.cast.framework) {
                    try {
                        var context = cast.framework.CastContext.getInstance();
                        context.requestSession().catch(function(err) {
                            console.log("Cast request session error:", err);
                            toggleCastModal();
                        });
                    } catch(e) {
                        toggleCastModal();
                    }
                } else {
                    toggleCastModal();
                }
            });

            function toggleCastModal() {
                if (castModal.classList.contains("open")) {
                    castModal.classList.remove("open");
                } else {
                    castModal.classList.add("open");
                    drawer.className = "channel-drawer";
                }
            }

            document.getElementById("cast-simulated-device").addEventListener("click", function() {
                alert("Conectando con la Smart TV de la red local...");
                castModal.classList.remove("open");
                castSession = { connected: true };
                castMedia(channels[currentIndex]);
            });

            window.__onGCastApiAvailable = function (isAvailable) {
                if (isAvailable && window.cast) {
                    var context = cast.framework.CastContext.getInstance();
                    context.setOptions({
                        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                    });

                    context.addEventListener(
                        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
                        function (event) {
                            switch (event.sessionState) {
                                case cast.framework.SessionState.SESSION_STARTED:
                                case cast.framework.SessionState.SESSION_RESUMED:
                                    castSession = context.getCurrentSession();
                                    castMedia(channels[currentIndex]);
                                    break;
                                case cast.framework.SessionState.SESSION_ENDED:
                                    castSession = null;
                                    loadChannel(currentIndex);
                                    break;
                            }
                        }
                    );
                }
            };

            function castMedia(channel) {
                if (!castSession) return;
                if (castSession.loadMedia) {
                    var mediaInfo = new chrome.cast.media.MediaInfo(channel.url, 'application/x-mpegurl');
                    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
                    mediaInfo.metadata.title = channel.name;
                    if (channel.logo) {
                        mediaInfo.metadata.images = [new chrome.cast.Image(channel.logo)];
                    }
                    var request = new chrome.cast.media.LoadRequest(mediaInfo);
                    castSession.loadMedia(request).catch(function(errorCode) {
                        console.error("Error al transmitir vía Cast:", errorCode);
                    });
                } else {
                    alert("Transmisión simulada exitosa hacia la pantalla grande: Reproduciendo '" + channel.name + "'");
                }
            }

            window.addEventListener("keydown", function (e) {
                showHUD();
                var key = e.keyCode || e.which;
                if (drawer.className.indexOf("open") === -1) {
                    if (key === 38) { // Flecha Arriba
                        e.preventDefault();
                        loadChannel((currentIndex - 1 + channels.length) % channels.length);
                    } else if (key === 40) { // Flecha Abajo
                        e.preventDefault();
                        loadChannel((currentIndex + 1) % channels.length);
                    }
                }
            });

            loadChannel(0);
            refreshIcons();
        })();
    </script>
</body>
</html>
